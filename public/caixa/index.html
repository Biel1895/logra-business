      </div>
    </header>
    <main class="site-main d-grid gap-4 py-4" id="app">
      <div data-page-view="overview"></div>
      <section class="site-card cash-chat p-3 p-md-4" aria-labelledby="cash-chat-title">
        <h2 id="cash-chat-title" class="cash-static-title">Assistente de vendas</h2>
        <div class="cash-chat-thread">
          <div class="cash-chat-bubble">
            <p>Me conte o que você vendeu e como recebeu. Eu organizo os campos para você conferir.</p>
          </div>
        </div>
        <form id="sale-form" class="cash-chat-composer">
          <label class="visually-hidden" for="sale-text">Descreva a venda</label>
          <textarea id="sale-text" rows="3" maxlength="1500"
            placeholder="Ex.: iPhone 14 preto = 1500 12x + 300 pix"></textarea>
          <div class="cash-chat-actions">
            <button id="sale-submit" type="submit" class="cash-action cash-action-primary" disabled>Lançar</button>
            <button id="manual-sale" type="button" class="cash-action">Lançar manual</button>
          </div>
        </form>
        <p id="sale-status" class="cash-chat-status" role="status"></p>
      </section>
      <section data-page-view="sales" aria-labelledby="cash-sales-title"></section>
      <section class="site-card p-3 p-md-4" aria-labelledby="cash-services-title">
        <h2 id="cash-services-title" class="cash-static-title">Serviços do dia</h2>
        <form id="service-form" class="cash-services-form">
          <div class="cash-services-fields">
            <div>
              <label for="service-parts">Peças</label>
              <textarea id="service-parts" class="cash-service-input" rows="3" maxlength="1500"
                placeholder="Tela XR loja&#10;Vidro traseiro XR Shoppcell R$ 40 pendente"></textarea>
            </div>
            <div>
              <label for="service-text">Manutenção <span>Pagamento opcional</span></label>
              <textarea id="service-text" class="cash-service-input" rows="3" maxlength="1500"
                placeholder="Troca de tela e vidro traseiro do iPhone XR = 515,00 pix"></textarea>
            </div>
          </div>
          <p class="text-muted small mb-0">Informe as peças, a manutenção ou ambos.</p>
          <div class="cash-chat-actions">
            <button id="service-submit" type="submit" class="cash-action cash-action-primary" disabled>Lançar serviço</button>
            <button id="manual-service" type="button" class="cash-action" aria-label="Lançar serviço manualmente">Lançar manual</button>
          </div>
          <p id="service-status" class="cash-error cash-service-status" role="status"></p>
        </form>
        <div data-page-view="services"></div>
      </section>
      <div data-page-view="movements"></div>
      <section data-page-view="closing" aria-label="Fechamento do caixa"></section>
    </main>
    <div data-page-view="dialog"></div>
  </div>
  <div id="notifications" aria-live="polite"></div>
</body>

</html>
